<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/triangle.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IIIF Viewer</title>
  </head>
  <body>
    <div class="page">
      <div id="iiif-container" class="iiif-container">
      </div>
    </div>
    <div id="iiif-test-panel" class="test-panel">
      <div class="test-panel-header">
        <span>IIIF URL Tester</span>
        <button id="test-panel-toggle" class="test-panel-collapse">−</button>
      </div>
      <div id="test-panel-body" class="test-panel-body">
        <div class="test-panel-input">
          <input id="iiif-url-input" type="text" placeholder="Enter any IIIF URL..." />
          <button id="iiif-url-submit">Parse</button>
        </div>
        <div id="iiif-result" class="test-panel-result"></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
